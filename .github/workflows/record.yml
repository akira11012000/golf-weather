name: 天気予報の的中を記録

on:
  schedule:
    - cron: "30 16 * * *"   # 毎日 日本時間 1:30
    - cron: "30 1 * * *"    # 念のため 日本時間 10:30 にも（記録済みの日は飛ばします）
  workflow_dispatch:         # 手動でも実行できるようにする

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 予報と実測を比べて記録
        run: python record.py
      - name: 記録ファイルを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "的中記録を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git push
          fi
